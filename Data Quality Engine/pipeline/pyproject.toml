[project]
name = "recon-engine"
version = "0.1.0"
description = "Multi-Source Data Reconciliation & Quality Engine for Indian equity market feeds (NSE + BSE)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "requests>=2.32",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
recon = "recon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
